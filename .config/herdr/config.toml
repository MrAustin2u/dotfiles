# herdr configuration
# Stows to ~/.config/herdr/config.toml
#
# Print every available option with its default: herdr --default-config
# Apply changes to a running server:            herdr server reload-config
# Anything not set here keeps the herdr default.

onboarding = false

[theme]
# Matches `theme = TokyoNight Moon` in .config/ghostty/config.
name = "tokyo-night"

[ui]
# Show the detected agent name in a split pane's border, so a pane running
# claude is identifiable without reading its output.
show_agent_labels_on_pane_borders = true

# A single-tab workspace has nothing to switch between, so the tab row is
# wasted height. New tabs still work via prefix+c.
hide_tab_bar_when_single_tab = true

# "hidden" gives the collapsed sidebar zero width instead of keeping a narrow
# status rail.
sidebar_collapsed_mode = "hidden"

# "priority" orders the agent panel as an attention queue: agents that need
# input come first. The default groups them by workspace instead.
agent_panel_sort = "priority"

# Ask Ghostty to raise a desktop notification when a background agent finishes
# or needs input.
[ui.toast]
delivery = "terminal"

# Sidebar rows for agent panes. Colors are tokyo-night: cyan for the agent
# name, light foreground for the reported title.
[ui.sidebar.agents]
rows = [
  ["state_icon", { token = "workspace", bold = true }],
  [{ token = "agent", fg = "#7dcfff" }],
]

# Coding agents set a terminal title describing what they are doing. Showing
# that beats a second row that always reads "claude".
[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", { token = "workspace", bold = true }],
  [{ token = "terminal_title_stripped", fg = "#c0caf5" }],
]

[keys]
# AeroSpace owns most alt chords system-wide and does not pass them through, so
# an alt binding here is silently dead. ~/.config/aerospace/aerospace.toml
# currently takes alt with 1..9, tab, comma, slash, e, f, g, h, j, k, l, w, y, z,
# and every alt+shift pair. Check that file before binding alt to anything.
#
# Carried over from tmux (tmux.reset.conf: `set -g prefix C-z`).
# This is the one binding worth keeping identical — everything else is new
# muscle memory anyway.
prefix = "ctrl+z"

# Workspace cycling and indexed jumps. herdr leaves all four of these unset.
#
# `ctrl+[` is the same byte as Escape unless the terminal reports the two
# separately, which needs the kitty keyboard protocol's disambiguate flag. If
# Escape starts switching workspaces in nvim, that flag is not reaching herdr:
# set this back to `prefix+[`.
previous_workspace = "ctrl+["
next_workspace = "ctrl+]"
switch_workspace = "prefix+shift+1..9"

# Walk the agent rows in the sidebar. With agent_panel_sort = "priority" this
# steps through the attention queue, so `prefix+a` repeatedly lands on whichever
# agent is waiting on input.
#
# There is no indexed `focus_agent` binding because there is no modifier left to
# put it on: prefix+1..9 is tabs, prefix+shift+1..9 is workspaces, and AeroSpace
# takes both alt+1..9 and ctrl+1..9 before herdr sees them.
next_agent = "prefix+a"
previous_agent = "prefix+shift+a"

# Pick one existing worktree and open it as a workspace. herdr leaves this
# unset. It pairs with `prefix+shift+g` (create a new worktree) and with
# `prefix+shift+o` below (open every worktree at once).
#
# A plain letter, because AeroSpace binds alt+g to focusing Ghostty and never
# passes it through. See the note above about alt chords.
open_worktree = "prefix+f"

# Removal is bound to the plugin action below, not to herdr's built-in
# `remove_worktree`, because the built-in leaves the empty <repo>__worktrees
# directory behind. Left unset so there is only one way to do this.
remove_worktree = ""

# Navigate mode moves between workspaces with the arrow keys by default.
navigate_workspace_up = "k"
navigate_workspace_down = "j"

# Pane focus moves to plain ctrl+h/j/k/l, handled by the seamless-navigation
# plugin below. Clearing these four frees prefix+h/j/k/l and is what the plugin's
# bindings replace. Resizing stays on herdr's built-in resize mode, prefix+r.
focus_pane_left = ""
focus_pane_down = ""
focus_pane_up = ""
focus_pane_right = ""

# Splits: `prefix+v` splits right, which already matches the old
# `bind-key v split-window -h`.
#
# Split down is `prefix+minus`, NOT `prefix+h`. In tmux `h` was bound to
# split-window -v. prefix+h used to be focus-pane-left, so this could not move;
# now that focus_pane_left is cleared, `split_horizontal = "prefix+h"` is free
# to take if that habit is worth restoring.
#
# New tab is `prefix+c`, NOT `prefix+n`. tmux had `bind-key n new-window`,
# but herdr uses prefix+n for next-tab and prefix+p for previous-tab.
# To restore the old habit, swap these three together — they conflict as a set:
#   new_tab = "prefix+n"
#   next_tab = "prefix+shift+n"      # or leave unset and use prefix+1..9
#   previous_tab = "prefix+shift+p"

# Worth knowing, no config needed:
#   prefix+q          detach (work keeps running)
#   prefix+shift+n    new workspace
#   prefix+shift+g    new git worktree as a workspace
#   prefix+1..9       jump to tab
#   prefix+b          toggle sidebar
#   prefix+z          zoom pane
#   prefix+r          resize mode, then h/j/k/l

# [worktrees]
# Where `new_worktree` puts checkouts. Left at the herdr default
# (~/.herdr/worktrees) because it does not map onto the workmux layout, which
# keeps them in <repo>__worktrees beside each repo. Set this only after
# deciding which tool owns worktree creation.
# directory = "~/.herdr/worktrees"

# [experimental]
# Do not enable pane_history without thinking about it. It writes recent
# terminal contents to session-history.json in plaintext, which would capture
# signing secrets, `op inject` output, and client message bodies.
# pane_history = true

# Mouse behaviour needs no configuration: mouse_capture and copy_on_select are
# both on by default, which already matches `set -g mouse on` plus the
# copy-pipe-to-pbcopy binding from tmux.

# Pane navigation without the prefix, replacing what vim-tmux-navigator did under
# tmux: ctrl+h/j/k/l crosses freely between nvim windows and herdr panes.
#
# The plugin lives in this repo and must be registered once per machine:
#   herdr plugin link ~/.config/herdr/plugins/seamless-navigation

# Opens every git worktree for the current repo as a workspace. workmux keeps
# worktrees in a sibling <repo>__worktrees directory and herdr does not scan for
# them at startup, so this populates them in one keystroke without changing which
# tool creates them.
#
#   herdr plugin link ~/.config/herdr/plugins/worktrees

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "dotfiles.worktrees.open-all"
description = "open all worktrees for this repo"

# `k` for kill, and deliberately nowhere near `prefix+f`: a slipped modifier
# should not turn "open this worktree" into "delete this worktree". prefix+k is
# free because focus_pane_up is cleared above. Asks for confirmation in a popup
# before deleting anything, and says up front whether the branch is going with
# the checkout: it is deleted only when its work has already landed on the base
# branch.
[[keys.command]]
key = "prefix+shift+k"
type = "plugin_action"
command = "dotfiles.worktrees.remove"
description = "remove this worktree"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "dotfiles.seamless-navigation.navigate-left"
description = "navigate left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "dotfiles.seamless-navigation.navigate-down"
description = "navigate down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "dotfiles.seamless-navigation.navigate-up"
description = "navigate up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "dotfiles.seamless-navigation.navigate-right"
description = "navigate right"

# Resize used to live on alt+h/j/k/l here. AeroSpace binds those four to
# `focus left/down/up/right` system-wide, so the keys never reached herdr and the
# bindings did nothing. Resizing is herdr's built-in resize mode instead:
# prefix+r, then h/j/k/l. The plugin still exposes its resize-* actions if a
# non-alt chord is ever worth binding.
