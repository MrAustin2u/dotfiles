id = "dotfiles.worktrees"
name = "Worktrees"
version = "0.5.0"
min_herdr_version = "0.7.4"
description = "Opens git worktrees for the current repo as workspaces, removes them without leaving the parent directory or a merged branch behind, and gives new ones a .env from the primary checkout or from .env.default"
platforms = ["macos"]

[[actions]]
id = "open-all"
title = "Open all worktrees for this repo"
contexts = ["workspace"]
command = ["./open-all"]

[[actions]]
id = "remove"
title = "Remove this worktree"
contexts = ["workspace"]
command = ["./remove"]

# The confirmation for `remove`. It has to be a popup rather than a split: a
# pane inside the target workspace would be destroyed halfway through, when the
# workspace it lives in closes.
[[panes]]
id = "confirm-remove"
title = "Remove worktree"
placement = "popup"
width = "60%"
height = 12
command = ["./confirm-remove"]

# Only fires for worktrees herdr itself creates. workmux already copies .env on
# `workmux add` through its own files.copy setting.
#
# An event name herdr does not recognise is a non-fatal warning, not an error, so
# a misspelling here leaves a silently dead hook. `herdr plugin list` reports it.
[[events]]
on = "worktree.created"
command = ["./copy-env"]
